[package]
name = "rython"
version = "0.1.0"
edition = "2021"

[lib]
name = "rython"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23.0", features = ["extension-module"] }
pest = "2.7"
pest_derive = "2.7"
pest_consume = "1.1"
cranelift = "0.68"
cranelift-module = "0.68"
cranelift-simplejit = "0.68"
cranelift-native = "0.68"
target-lexicon = "0.12"
once_cell = "1.20"
rayon = "1.10"